<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeTasks | Pro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app-container">
        <header>
            <h1>TypeTasks</h1>
            <p>Type-safe task management.</p>
        </header>

        <section class="input-section">
            <input type="text" id="task-input" placeholder="What needs to be done?">
            <button id="add-btn">Add Task</button>
        </section>

        <section class="filter-section" id="filter-controls">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="todo">To Do</button>
            <button class="filter-btn" data-filter="done">Done</button>
        </section>

        <ul id="task-list">
            <!-- Tasks will be injected here by app.ts -->
        </ul>
    </main>

    <!-- Load the compiled JavaScript file as a module -->
    <script type="module" src="app.js"></script>
</body>
</html>
